name: Demo

# main 에 밀면 브라우저 데모가 다시 올라간다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 밀어 넣는 중간 커밋 때문에 배포가 취소되지는 않게 한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 이 저장소에는 빌드 도구가 없다. main.js 가 그대로 커밋돼 있어서,
      # 데모를 만드는 데 필요한 것은 node 와 스크립트 하나뿐이다.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node scripts/build-demo.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
